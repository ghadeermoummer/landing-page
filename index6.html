<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطور براند | أفخم العطور في غزة</title>
    <meta name="description" content="متجر عطور براند - وجهتك الأولى للعطور الفاخرة والفريدة في غزة. تشكيلة مميزة من العطور الرجالية والنسائية وعطور المناسبات.">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-light-yellow: #FEF2A0;
            --color-warm-gold: #F3CD97;
            --color-copper-orange: #E98B50;
            --color-luxury-red: #BC4F4F;
            --color-dark-red: #8B3232;
            --color-text: #333333;
            --color-white: #ffffff;
            --color-whatsapp: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--color-light-yellow);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            background-color: var(--color-white);
            box-shadow: 0 2px 10px rgba(188, 79, 79, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--color-luxury-red);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--color-luxury-red);
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--color-copper-orange);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            color: var(--color-luxury-red);
            font-size: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--color-luxury-red);
            color: var(--color-white);
            padding: 10px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            transition: background 0.3s, transform 0.2s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: var(--color-copper-orange);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--color-luxury-red);
            border: 2px solid var(--color-luxury-red);
            padding: 10px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background-color: var(--color-luxury-red);
            color: var(--color-white);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--color-warm-gold), var(--color-light-yellow));
            padding: 70px 0;
            display: flex;
            align-items: center;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero-text h1 {
            font-size: 42px;
            color: var(--color-luxury-red);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero-text p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .hero-image img {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        /* Section Styling */
        .section-title {
            text-align: center;
            margin: 60px 0 35px 0;
        }

        .section-title h2 {
            font-size: 32px;
            color: var(--color-luxury-red);
            position: relative;
            display: inline-block;
        }

        .section-title h2::after {
            content: '';
            width: 60%;
            height: 3px;
            background-color: var(--color-copper-orange);
            position: absolute;
            bottom: -8px;
            right: 20%;
            border-radius: 2px;
        }

        /* Categories */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: var(--color-white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.3s;
            text-decoration: none;
            color: inherit;
        }

        .category-card:hover {
            transform: translateY(-8px);
        }

        .category-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .category-card h3 {
            padding: 15px;
            color: var(--color-luxury-red);
        }

        /* Best Sellers & Products */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: var(--color-white);
            border: 1px solid var(--color-warm-gold);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--color-copper-orange);
            color: var(--color-white);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            color: var(--color-luxury-red);
            font-size: 20px;
            margin-bottom: 8px;
        }

        .product-card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .price-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 20px;
            font-weight: 800;
            color: var(--color-luxury-red);
        }

        .old-price {
            text-decoration: line-through;
            color: #999;
            font-size: 15px;
        }

        /* Brand Experience */
        .experience {
            background-color: var(--color-warm-gold);
            padding: 60px 0;
            margin-top: 60px;
            border-radius: 20px;
        }

        /* Why Choose Us */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .feature-box {
            background: var(--color-white);
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .feature-box i {
            font-size: 36px;
            color: var(--color-copper-orange);
            margin-bottom: 15px;
        }

        /* Newsletter */
        .newsletter {
            background: linear-gradient(135deg, var(--color-luxury-red), var(--color-dark-red));
            color: var(--color-white);
            padding: 50px 20px;
            border-radius: 20px;
            text-align: center;
            margin: 60px 0;
        }

        .newsletter h2 {
            margin-bottom: 10px;
        }

        .newsletter form {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 500px;
            margin: 25px auto 0 auto;
        }

        .newsletter input {
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            width: 70%;
            outline: none;
        }

        .newsletter button {
            background-color: var(--color-warm-gold);
            color: var(--color-luxury-red);
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
        }

        /* FAQ - Accordion */
        .faq-list {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background-color: var(--color-white);
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid var(--color-warm-gold);
            overflow: hidden;
        }

        .
